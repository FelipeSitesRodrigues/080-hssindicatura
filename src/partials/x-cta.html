    <!-- @usa x-cta -->
    <section class="secao secao--escura cta-final" id="proximo-passo" aria-labelledby="cta-titulo" data-zap-some>
      <div class="cta-final__fundo" aria-hidden="true">
        <img data-img="cta-fundo" data-desk="cta-faixa" data-img-max="800" sizes="100vw" alt="" loading="lazy" decoding="async">
      </div>
      <div class="container cta-final__grade">
        <div data-revela>
          <p class="rotulo">{{p.rotulo}}</p>
          <h2 class="titulo cta-final__titulo" id="cta-titulo">{{p.titulo}} <span class="destaque">{{p.destaque}}</span></h2>
          <p class="apoio cta-final__apoio">{{p.texto}}</p>
        </div>
        <div class="cta-final__botoes" data-revela style="--i:1">
          <a class="btn btn--dourado" href="{{p.link1}}" data-zap="fim-principal">{{p.botao1}}<i data-i="arrow-right" data-w="regular" class="i--anda"></i></a>
          <a class="btn btn--contorno" href="{{p.link2}}" data-zap="fim-secundario">{{p.botao2}}</a>
        </div>
      </div>
    </section>
